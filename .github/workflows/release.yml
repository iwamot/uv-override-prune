# Uses iwamot/actions (composite), not iwamot/workflows (reusable):
# PyPI Trusted Publishing rejects reusable workflows because
# job_workflow_ref points to the callee.
# See https://github.com/pypi/warehouse/issues/11096

name: Release

on:
  push:
    tags: ['v*.*.*']

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    permissions:
      contents: write  # to manage the GitHub Release lifecycle
      id-token: write  # for PyPI Trusted Publishing OIDC
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@9ca718d3bf646d6534007c269a635b3e54cadf99 # v2.19.2
        with:
          egress-policy: audit

      - uses: iwamot/actions/release-draft@09a90ef28919b6331a2930f6e61eeca11bc634de # v0.9.0
      - uses: iwamot/actions/uv-publish@09a90ef28919b6331a2930f6e61eeca11bc634de # v0.9.0
      - uses: iwamot/actions/release-publish@09a90ef28919b6331a2930f6e61eeca11bc634de # v0.9.0
