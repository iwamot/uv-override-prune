# Uses iwamot/actions (composite), not iwamot/workflows (reusable):
# PyPI Trusted Publishing rejects reusable workflows because
# job_workflow_ref points to the callee.
# See https://github.com/pypi/warehouse/issues/11096

name: Publish

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

jobs:
  publish-pypi:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: iwamot/actions/uv-publish@b7e018129d96b7170299c823014121079bce06d0 # v0.4.0
