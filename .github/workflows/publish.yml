# Uses iwamot/actions (composite), not iwamot/workflows (reusable):
# PyPI Trusted Publishing rejects reusable workflows because
# job_workflow_ref points to the callee.
# See https://github.com/pypi/warehouse/issues/11096

name: Publish

on:
  push:
    tags: ['v*.*.*']

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish-pypi:
    name: publish-pypi
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    permissions:
      contents: read
      id-token: write  # for PyPI Trusted Publishing OIDC
    steps:
      - uses: iwamot/actions/uv-publish@792bb6f7b66b5d046aa285d39303a0aa7b10f822 # v0.5.0
