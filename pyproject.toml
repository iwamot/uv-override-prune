[project]
name = "uv-override-prune"
dynamic = ["version"]
description = "Detect redundant override-dependencies / constraint-dependencies in uv projects"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Takashi Iwamoto" }]
keywords = ["uv", "override", "dependencies", "audit", "prune"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development",
]
dependencies = [
    "packaging",
    "tomlkit",
]

[project.scripts]
uv-override-prune = "uv_override_prune.cli:main"

[project.urls]
Repository = "https://github.com/iwamot/uv-override-prune"
Issues = "https://github.com/iwamot/uv-override-prune/issues"

[project.optional-dependencies]
dev = [
    "pip-licenses==5.5.5",
    "pytest==9.0.3",
    "pytest-cov==7.1.0",
    "uv-override-prune==0.0.5",
]

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "src/uv_override_prune/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/uv_override_prune"]

[tool.hatch.build.targets.sdist]
exclude = [
    "/.codecov.yml",
    "/.github",
    "/compatibility.sh",
    "/mise.toml",
    "/uv.lock",
    "/validate.sh",
]

[tool.uv]
exclude-newer = "1 day"
exclude-newer-package = { "uv-override-prune" = "0 days" }

[tool.ruff]
include = ["*.py", "src/**/*.py", "tests/**/*.py"]

[tool.ruff.lint]
# Reference: https://pydevtools.com/handbook/how-to/how-to-configure-recommended-ruff-defaults/
extend-select = [
    "F",    # Pyflakes rules
    "W",    # PyCodeStyle warnings
    # "E",    # PyCodeStyle errors
    "I",    # Sort imports properly
    "UP",   # Warn if certain things can changed due to newer Python versions
    "C4",   # Catch incorrect use of comprehensions, dict, list, etc
    "FA",   # Enforce from __future__ import annotations
    "ISC",  # Good use of string concatenation
    "ICN",  # Use common import conventions
    "RET",  # Good return practices
    # "SIM",  # Common simplification rules
    "TID",  # Some good import practices
    # "TC",   # Enforce importing certain types in a TYPE_CHECKING block
    "PTH",  # Use pathlib instead of os.path
    "TD",   # Be diligent with TODO comments
    # "NPY",  # Some numpy-specific things
    # Not in the reference URL
    "S",    # flake8-bandit (security)
]
ignore = [
    "S101",  # Allow assert in tests (pytest standard practice)
]

[tool.ty.src]
include = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["uv_override_prune"]
branch = true

[tool.coverage.report]
show_missing = true
